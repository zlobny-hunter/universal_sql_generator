<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор SQL скриптов v1.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-logo {
            height: 100px;
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-light">
<!-- Увеличенная ширина контейнера до 1200px -->
<div class="container mt-5" style="max-width: 1200px;">
    <div class="card shadow p-4">
        <!-- Шапка с логотипом слева и заголовком по центру -->
        <div class="d-flex align-items-center mb-4 position-relative">
            <img src="/static/logo.png" alt="Логотип" class="card-logo" onerror="this.style.display='none'">
            <h2 class="w-100 text-center mb-0 position-absolute">Универсальный генератор SQL</h2>
        </div>

        <form action="/generate/" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="module_id" class="form-label">Выберите модуль генерации:</label>
                <select class="form-select" id="module_id" name="module_id" required>
                    <option value="" selected disabled>-- Выберите модуль --</option>
                    {% for mod in modules %}
                        <option value="{{ mod.id }}">{{ mod.name }} — {{ mod.description }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="file" class="form-label">Загрузить CSV файл с данными:</label>
                <input class="form-control" type="file" id="file" name="file" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Сгенерировать и скачать SQL</button>
        </form>
    </div>
</div>
</body>
</html>
